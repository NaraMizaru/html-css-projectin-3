<!DOCTYPE html>
<html>
<head>
    <title>Box Model</title>
    <style>
        .box {
            width: 200px;
            height: 100px;

            background-color: lightblue; /* Content */

            padding: 30px; /* jarak content ke border */

            border: 10px solid blue; /* garis pembatas */

            margin: 40px; /* jarak keluar box */
        }

        .container {
            background-color: lightgray;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box">
            Ini adalah Content
        </div>
    </div>

</body>
</html>
